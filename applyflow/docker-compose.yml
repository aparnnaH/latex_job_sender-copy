services:
  postgres:
    image: postgres:16-alpine
    container_name: applyflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-applyflow}
      POSTGRES_USER: ${POSTGRES_USER:-applyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applyflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - applyflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applyflow} -d ${POSTGRES_DB:-applyflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: applyflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-applyflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-applyflow}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  applyflow-postgres-data:

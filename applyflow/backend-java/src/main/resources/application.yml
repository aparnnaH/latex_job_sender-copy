spring:
  application:
    name: applyflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:applyflow}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:applyflow}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:applyflow}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:applyflow}
    password: ${RABBITMQ_PASSWORD:applyflow}
    listener:
      simple:
        acknowledge-mode: manual

applyflow:
  storage:
    resumes-dir: ${APPLYFLOW_RESUME_STORAGE_DIR:${java.io.tmpdir}/applyflow/resumes}
    max-upload-bytes: ${APPLYFLOW_MAX_UPLOAD_BYTES:1048576}
  tailoring:
    python-executable: ${PYTHON_EXECUTABLE:python3}
    python-script-path: ${PYTHON_TAILORING_SCRIPT_PATH:../resume-tailor-python/tailor_resume.py}
    timeout: ${PYTHON_TAILORING_TIMEOUT:PT60S}
    max-attempts: ${APPLYFLOW_TAILORING_RETRY_ATTEMPTS:3}
  document-service:
    base-url: ${APPLYFLOW_DOCUMENT_SERVICE_URL:http://localhost:5000}
    timeout: ${APPLYFLOW_DOCUMENT_SERVICE_TIMEOUT:PT60S}
    python-fallback-enabled: ${APPLYFLOW_DOCUMENT_SERVICE_PYTHON_FALLBACK_ENABLED:false}
    compile-pdf: ${APPLYFLOW_DOCUMENT_SERVICE_COMPILE_PDF:true}
  rabbitmq:
    exchange: ${APPLYFLOW_RABBITMQ_EXCHANGE:applyflow.resume-tailoring}
    queue: ${APPLYFLOW_RABBITMQ_QUEUE:applyflow.resume-tailoring.requests}
    routing-key: ${APPLYFLOW_RABBITMQ_ROUTING_KEY:resume.tailoring.requested}
    dead-letter-exchange: ${APPLYFLOW_RABBITMQ_DLX:applyflow.resume-tailoring.dlx}
    dead-letter-queue: ${APPLYFLOW_RABBITMQ_DLQ:applyflow.resume-tailoring.dead}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,rabbit,documentService
        liveness:
          include: livenessState,ping
  endpoints:
    web:
      exposure:
        include: health
